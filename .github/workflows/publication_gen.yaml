name: Generate publications
on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  workflow_run:
    workflows: ['Get Citation Data']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: publication-generation
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: google-scholar-stats
          path: .scholar-stats
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: publication_generator/requirements.txt
      - run: python -m pip install -r publication_generator/requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Run publication generator script
        run: python publication_generator/pubGen.py
        env:
          SCHOLAR_DATA_PATH: .scholar-stats/gs_data.json
          GS_PRIVATE_KEY_ID: ${{ secrets.GS_PRIVATE_KEY_ID }}
          GS_PRIVATE_KEY: ${{ secrets.GS_PRIVATE_KEY }}
      - name: Commit and push changes
        run: |
          git config user.name "Zhu Deng"
          git config user.email "zhudeng94@gmail.com"
          git add _pages/includes/pub_list.md _pages/includes/pub_selected.md
          if git diff --cached --quiet; then
            echo "Publication output unchanged."
            exit 0
          fi
          git commit -m "Update publication list"
          git push origin HEAD:main
