# Filename retained so existing workflow links continue to work. No Scholar requests.
name: Get OpenAlex Citation Data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
permissions:
  contents: write
concurrency:
  group: openalex-data-refresh
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          # Reuse the existing data branch, preserving every gs_data*.json file.
          ref: google-scholar-stats
          path: .citation-stats
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Retrieve and validate OpenAlex citation data
        run: python openalex_crawler/main.py
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      - name: Publish complete OpenAlex snapshot
        run: |
          cp openalex_crawler/results/openalex_data.json .citation-stats/
          cd .citation-stats
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add openalex_data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update OpenAlex citation data"
          git push origin HEAD:google-scholar-stats
