name: Get Citation Data
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
permissions:
  contents: write
concurrency:
  group: scholar-data-refresh
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: google-scholar-stats
          path: .scholar-stats
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Verify scholarly imports
        run: python -c 'from scholarly import scholarly; from bibtexparser.bibdatabase import BibDatabase'
      - name: Retrieve citation data
        working-directory: google_scholar_crawler
        run: python main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          GS_PRIVATE_KEY_ID: ${{ secrets.GS_PRIVATE_KEY_ID }}
          GS_PRIVATE_KEY: ${{ secrets.GS_PRIVATE_KEY }}
      - name: Validate and publish citation data
        run: |
          PYTHONPATH=publication_generator python -c 'from citation_data import load_citation_data; load_citation_data("google_scholar_crawler/results/gs_data.json")'
          cp google_scholar_crawler/results/gs_data*.json .scholar-stats/
          cd .scholar-stats
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add gs_data*.json
          if git diff --cached --quiet; then
            echo "Citation output unchanged."
            exit 0
          fi
          git commit -m "Updated Citation Data"
          git push origin HEAD:google-scholar-stats
