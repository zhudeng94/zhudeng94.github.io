name: Test academic data updates
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r google_scholar_crawler/requirements.txt -r publication_generator/requirements.txt
      - run: python -m pip check
      - run: python -c 'from scholarly import scholarly; from bibtexparser.bibdatabase import BibDatabase'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q publication_generator google_scholar_crawler tests
