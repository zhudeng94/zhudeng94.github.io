<!-- Legacy include filename retained; statistics now come exclusively from OpenAlex. -->
<script>
$(document).ready(function () {
    $.getJSON('https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/openalex_data.json', function (data) {
        if (data.source !== 'OpenAlex' || data.schema_version !== 1 || data.author_id !== 'https://openalex.org/A5088725316') return;
        var fields = {total_paper_number: 'works_count', h_index: 'hindex', openalex_citations: 'citedby'};
        Object.keys(fields).forEach(function (id) {
            var count = data[fields[id]], el = document.getElementById(id);
            if (el && Number.isInteger(count) && count >= 0) el.textContent = count;
        });
        var updated = document.getElementById('citation_updated');
        if (updated && data.updated) updated.textContent = 'Updated: ' + data.updated.slice(0, 10) + ' (UTC).';
    }); // On network/missing-snapshot errors retain N/A, never display Scholar data as OpenAlex.
});
</script>
